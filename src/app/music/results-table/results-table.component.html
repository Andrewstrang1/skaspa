<div *ngIf="loading" class="loading-spinner">
  <div class="spinner"></div>
  <span>Loading...</span>
</div>

<app-data-table-h
  [data]="results"
  [displayedColumns]="displayedColumns"
  [showTiles]="true"
  [themeClass]="'purple-theme'"
  [actionButtons]="actionButtons"
  [tableTitle] = "title"
  [pageSize]="10">
</app-data-table-h>



<div *ngIf="!loading && results.length === 0">
  <p>No results found.</p>
</div>
