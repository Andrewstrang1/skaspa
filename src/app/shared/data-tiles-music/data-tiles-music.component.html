<div class="datatable-container" [ngClass]="themeClass">
    <!-- Inline SVG gradient for half fill -->
    <svg width="0" height="0">
      <defs>
        <linearGradient id="halfGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#ddd;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>
  
    <!-- Loading Spinner -->
    <div *ngIf="loading" class="loading-spinner">
      <div class="spinner"></div>
      <span>Loading data...</span>
    </div>
  
    <!-- Main Content -->
    <div *ngIf="!loading">
      <div class="action-buttons-container">
        <!-- Title and Search Box on the Same Row -->
        <div class="title-and-search">
          <!-- Table Title -->
          <h3 *ngIf="tableTitle" class="table-title">{{ tableTitle }}</h3>
          <!-- Autocomplete Search Box -->
          <div class="search-box">
            <div class="search-input-container">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="search-icon"
                viewBox="0 0 16 16">
                <path
                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
              </svg>
              <input type="text" placeholder="Search" class="search-input" (input)="onSearchInputChange($event)" />
            </div>
          </div>
          <div class="record-count" *ngIf="data.length > 0">
            {{ searchTerm ? filteredData.length : data.length }} records found
          </div>
        </div>
        
      </div>
  
      <!-- Tiled Display -->
      <div class="tiled-container">
        <div class="music-tile" *ngFor="let album of pagedData">
          <img [src]="album.artworkUrl" alt="{{ album.title }}" class="tile-image" />
          <div class="music-tile-details">
            <h4>{{ album.title }}</h4>
            <p><strong>Artist:</strong> {{ album.title }}</p>
            <p><strong>Catalog:</strong> {{ album.catalogNumber }}</p>
            <div class="tile-actions">
              <button class="action-button" (click)="viewAlbumDetails(album)">View Details</button>
              <button *ngIf="selectable" class="action-button">
                <input type="checkbox" (change)="toggleRowSelection(album, $event)" [checked]="selectedRows.includes(album)" />
                Select
              </button>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Pagination with Rows per Page Selector -->
      <div class="pagination">
        <button (click)="changePage(1)" [disabled]="currentPage === 1">First</button>
        <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">Previous</button>
        <span>Page {{ currentPage }} of {{ totalPages }}</span>
        <button (click)="changePage(currentPage + 1)" [disabled]="currentPage >= totalPages">Next</button>
        <button (click)="changePage(totalPages)" [disabled]="currentPage >= totalPages">Last</button>
  
        <div class="page-size-selector">
          <span>Rows per page:</span>
          <select id="pageSize" (change)="changePageSize($event)" [value]="pageSize">
            <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
          </select>
        </div>
      </div>
    </div>
  
    <ng-template #emptyState>
      <div class="empty-message">No records found</div>
    </ng-template>
  </div>
