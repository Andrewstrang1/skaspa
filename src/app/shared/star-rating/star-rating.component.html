<div class="star-rating">
  <ng-container *ngFor="let star of getStarArray(); let i = index">
    <svg
      class="star"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      (click)="setRating(i + 1)"
      (mouseenter)="onHover(i + 1)"
      (mouseleave)="onLeave()"
      [ngClass]="{
        'star-full': star === 1,
        'star-half': star === 0.5,
        'star-empty': star === 0
      }"
    >
      <path d="M12 .587l3.668 7.568L24 9.75l-6 5.915L19.335 24 12 19.988 4.665 24 6 15.665 0 9.75l8.332-1.595L12 .587z" />
    </svg>
  </ng-container>

  <span *ngIf="reviewCount !== undefined" class="review-count">
    ({{ reviewCount }} reviews)
  </span>
</div>
